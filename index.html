<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="记账本"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#2d5b61"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json">
<title>记账本</title>
<style>
:root{--bg:#f2f4f6;--sf:#fff;--sf2:#eef1f4;--ink:#14202b;--mu:#7b8794;--ln:rgba(20,32,43,.08);--ac:#1f6f6b;--out:#c4533f;--in:#2e7d5b;--bar:rgba(255,255,255,.84);--sh:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.05);--pb:linear-gradient(135deg,#1f6f6b,#2f8a84);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1317;--sf:#171e24;--sf2:#212a32;--ink:#eaeff3;--mu:#8793a0;--ln:rgba(255,255,255,.08);--ac:#58b4ad;--out:#ee8a76;--in:#6fcf9f;--bar:rgba(23,30,36,.84);--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"SF Pro Text","Hiragino Sans","PingFang SC",sans-serif;font-feature-settings:"tnum";-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(130px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header{display:flex;align-items:center;margin:6px 2px 14px}
h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;margin:28px 4px 10px;color:var(--mu);font-weight:600;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--ln)}
nav button{background:none;border:0;padding:8px 14px;border-radius:14px;color:var(--mu);font-size:14px;min-width:58px}
nav button.on{color:var(--ac);background:var(--sf2);font-weight:700}
.add{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(82px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--pb);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 22px rgba(31,111,107,.4)}
.add:active{transform:scale(.95)}
.mn{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:14px}
.mn button{background:var(--sf);border:0;border-radius:50%;width:40px;height:40px;box-shadow:var(--sh);font-size:18px}
.mn span{font-weight:600;min-width:120px;text-align:center;font-size:16px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;background:linear-gradient(145deg,#173f44,#2a7a76);color:#fff;border-radius:24px;padding:22px 22px 20px;margin-bottom:16px;box-shadow:0 10px 28px rgba(23,63,68,.28)}
.sum>div{font-size:19px;font-weight:600}
.sum>div:nth-child(3){grid-column:1/-1;order:-1;display:flex;flex-direction:column-reverse;font-size:36px;font-weight:700;letter-spacing:-.02em}
.sum>div:only-child{font-size:34px;font-weight:700}
.sum small{display:block;font-weight:400;color:rgba(255,255,255,.68);font-size:12px;letter-spacing:.04em}
.sum .in{color:#b8f0d3}.sum .out{color:#ffd0c5}
.out{color:var(--out)}.in{color:var(--in)}
small,.mu{color:var(--mu);font-size:12px}
input,select{font:inherit;font-size:16px;color:inherit;background:var(--sf2);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--ac);outline:0}
.q{margin-bottom:8px;background:var(--sf);box-shadow:var(--sh)}
.dh{font-size:12px;color:var(--mu);margin:18px 6px 8px;font-weight:600;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.row:active{transform:scale(.985)}
.ic{flex:0 0 40px;height:40px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font-size:19px}
.mid{flex:1;min-width:0;line-height:1.35}
.mid>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;white-space:nowrap;font-size:16px}
.empty{color:var(--mu);text-align:center;padding:56px 0;font-size:14px}
.card{background:var(--sf);border-radius:16px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.bar{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--pb);border-radius:4px}
.bar.over i{background:var(--out)}
.line{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.tr{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:6px}
.tr div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.tr i{display:block;background:var(--pb);border-radius:6px;min-height:3px;margin-bottom:6px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--sf);box-shadow:var(--sh);border-radius:16px;padding:4px 12px;margin:0 6px 8px 0;font-size:13px}
.chip b{cursor:pointer;color:var(--mu);font-size:16px}
.g{display:flex;gap:8px}
.g>*{flex:1}
.btn{background:var(--sf);border:0;box-shadow:var(--sh);border-radius:12px;padding:10px 16px;min-height:44px}
.btn.p{background:var(--pb);color:#fff;font-weight:600;box-shadow:none}
.btn.d{color:var(--out)}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:9px;border-radius:10px}
.seg button.on{background:var(--sf);color:var(--ac);font-weight:700;box-shadow:var(--sh)}
label{display:block;font-size:12px;color:var(--mu);margin:14px 2px 6px;font-weight:600}
dialog{border:0;border-radius:24px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:min(440px,94vw);max-height:90vh;overflow:auto;background:var(--sf);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,16,22,.45);backdrop-filter:blur(3px)}
@media(max-width:600px){dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:26px 26px 0 0;animation:up .26s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;display:none;font-size:14px;z-index:20}

:root{--bg:#f2f2f7;--sf:#fff;--sf2:#f2f2f7;--ink:#1c1c1e;--mu:#8e8e93;--ln:rgba(60,60,67,.14);--ac:#007aff;--out:#ff3b30;--in:#248a3d;--bar:rgba(249,249,249,.86);--sh:0 0 0 .5px rgba(0,0,0,.04),0 2px 12px rgba(0,0,0,.04);--pb:#007aff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--sf:#1c1c1e;--sf2:#2c2c2e;--ink:#f2f2f7;--ln:rgba(84,84,88,.5);--ac:#0a84ff;--out:#ff453a;--in:#32d74b;--bar:rgba(28,28,30,.86);--sh:none;--pb:#0a84ff}}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","Hiragino Sans","PingFang SC",sans-serif}
h1{font-size:34px;letter-spacing:-.02em}
h2{font-size:13px;letter-spacing:0;margin:30px 6px 8px}
.sum{background:linear-gradient(160deg,#2c2c2e,#0b0b0c);border-radius:26px;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.sum>div:nth-child(3){font-size:40px;letter-spacing:-.03em}
.sum .in{color:#7ee2a0}.sum .out{color:#ff9a90}
.card{border-radius:20px}
.add{width:56px;height:56px;background:var(--pb);box-shadow:0 8px 24px rgba(0,122,255,.38);font-weight:300;font-size:32px}
.btn.p{background:var(--pb)}
.bar i,.tr i{background:var(--pb)}
nav{border-top:.5px solid var(--ln)}
nav button{font-size:13px;border-radius:12px}
nav button.on{background:transparent;color:var(--ac);font-weight:600}
.dh{margin:22px 6px 8px;letter-spacing:0}
#lst .row{border-radius:0;margin:0;box-shadow:none;transition:background .15s}
#lst .row+.row{border-top:.5px solid var(--ln)}
#lst .row:active{background:var(--sf2);transform:none}
#lst .dh+.row{border-radius:20px 20px 0 0}
#lst .row:has(+.dh),#lst .row:last-child{border-radius:0 0 20px 20px}
#lst .dh+.row:has(+.dh),#lst .dh+.row:last-child{border-radius:20px}
.seg{border-radius:10px}.seg button.on{box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dn{display:flex;flex-direction:column;align-items:center;padding:22px 18px 8px}
.dsv{width:220px;height:220px}.seg circle,circle.seg{transition:opacity .2s;cursor:pointer}
.dl{font-size:11px;fill:var(--mu)}.dv{font-size:17px;font-weight:700;fill:var(--ink)}
.lg{width:100%;margin-top:14px}
.li{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:.5px solid var(--ln);font-size:15px;cursor:pointer}
.li i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.li span:nth-of-type(1){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li b{font-weight:600;min-width:88px;text-align:right}
@media(max-width:600px){dialog::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--ln);margin:-10px auto 16px}}
</style></head>
<body>
<div id="app"></div>
<dialog id="D"></dialog>
<div id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const KEY='ledger.v1',$=s=>document.querySelector(s),D=$('#D');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SYM={JPY:'¥',CNY:'CN¥'};
function seed(){return{accounts:[{id:uid(),name:'现金',cur:'JPY',init:0},{id:uid(),name:'银行卡',cur:'JPY',init:0},{id:uid(),name:'信用卡',cur:'JPY',init:0},{id:uid(),name:'支付宝',cur:'CNY',init:0}],
cats:{out:['餐饮','日用品','交通','房租水电','通讯','购物','医疗','娱乐','旅行','人情','教育','汽车','其他'],in:['工资','副业收入','退款','红包','投资收益','其他']},
tx:[],rec:[],rate:21,base:'JPY',budget:0}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.accounts)return d}catch(e){}return seed()}
let S=load();S.cb=S.cb||{};S.debts=S.debts||[];S.rec=S.rec||[];if(!S.cats.out.includes('手续费'))S.cats.out.push('手续费');
let V={tab:'list',m:today().slice(0,7),q:''},F={};
const IC={餐饮:'🍜',日用品:'🧴',交通:'🚃',房租水电:'🏠',通讯:'📱',购物:'🛍️',医疗:'💊',娱乐:'🎬',旅行:'✈️',人情:'🎁',教育:'📚',汽车:'🚗',其他:'🧾',工资:'💴',副业收入:'💼',退款:'↩️',红包:'🧧',投资收益:'📈',转账:'🔁',手续费:'🏦',借出:'🤝',借入:'🤝',收回借款:'✅',偿还借款:'✅'},DC=['借出','借入','收回借款','偿还借款'],TN={cash:'现金',bank:'银行卡',credit:'信用卡',wallet:'电子钱包',invest:'投资'};
function dueTxt(d){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());let x=new Date(t.getFullYear(),t.getMonth(),d);if(x<t)x=new Date(t.getFullYear(),t.getMonth()+1,d);const k=Math.round((x-t)/864e5);return '还款日 '+d+' 号'+(k<=7?'（'+(k?k+' 天后':'今天')+'）':'')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存失败：浏览器禁止了本地存储，请先导出备份')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const r=c=>c==='JPY'?1:S.rate;
const conv=(a,f,t)=>a*r(f)/r(t);
function fmt(n,c){const d=c==='JPY'?0:2;return(n<0?'-':'')+SYM[c]+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
const acc=id=>S.accounts.find(a=>a.id===id)||{id,name:'（已删除）',cur:'JPY',init:0};
function bal(a){let b=+a.init;S.tx.forEach(t=>{if(t.type==='in'&&t.acc===a.id)b+=t.amt;else if(t.type==='out'&&t.acc===a.id)b-=t.amt;else if(t.type==='tr'){if(t.acc===a.id)b-=t.amt;if(t.to===a.id)b+=t.toAmt}});return b}
function shiftM(m,d){const[y,o]=m.split('-').map(Number),x=new Date(y,o-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)}
function monthSum(m){let i=0,o=0,c={},G={};S.tx.forEach(t=>{if(!t.date.startsWith(m)||t.type==='tr'||DC.includes(t.cat))return;const v=conv(t.amt,acc(t.acc).cur,S.base);if(t.type==='in')i+=v;else{o+=v;c[t.cat]=(c[t.cat]||0)+v;(t.tag||'').split(/[,，\s]+/).filter(Boolean).forEach(g=>G[g]=(G[g]||0)+v)}});return{i,o,c,G}}
function mv(d){V.m=shiftM(V.m,d);render()}

function applyRec(){const n=new Date(),cm=n.getFullYear()*12+n.getMonth(),td=today();let ch=0;
S.rec.forEach(x=>{const[y,m]=x.last.split('-').map(Number);let k=y*12+m-1;
while(k<cm){k++;const yy=Math.floor(k/12),mm=k%12,dim=new Date(yy,mm+1,0).getDate(),date=yy+'-'+pad(mm+1)+'-'+pad(Math.min(x.day,dim));
if(date>td)break;S.tx.push({id:uid(),type:x.type,amt:x.amt,acc:x.acc,cat:x.cat,date,note:x.note?x.note+'（每月固定）':'每月固定'});x.last=yy+'-'+pad(mm+1);ch=1}});
if(ch)save()}

function render(){
const tabs=[['list','明细'],['stats','统计'],['acc','账户'],['debt','借还'],['set','设置']];
let h=`<header><h1>记账本</h1><button class="add" onclick="openTx()" aria-label="记一笔">＋</button></header><nav>${tabs.map(([k,n])=>`<button class="${V.tab===k?'on':''}" onclick="V.tab='${k}';render()">${n}</button>`).join('')}</nav>`;
if(V.tab==='list'||V.tab==='stats')h+=`<div class="mn"><button onclick="mv(-1)" aria-label="上个月">‹</button><span>${V.m.replace('-','年')}月</span><button onclick="mv(1)" aria-label="下个月">›</button></div>`;
h+=({list:listView,stats:statsView,acc:accView,debt:debtView,set:setView})[V.tab]();
$('#app').innerHTML=h}

function listView(){const s=monthSum(V.m),B=S.base;
return`<div class="sum"><div class="in">${fmt(s.i,B)}<small>收入</small></div><div class="out">${fmt(s.o,B)}<small>支出</small></div><div>${fmt(s.i-s.o,B)}<small>结余</small></div></div>
<input class="q" placeholder="搜索备注、分类、账户" value="${esc(V.q)}" oninput="V.q=this.value;$('#lst').innerHTML=rows()"><div id="lst">${rows()}</div>`}
function rows(){let ts=S.tx.filter(t=>t.date.startsWith(V.m));const q=V.q.trim().toLowerCase();
if(q)ts=ts.filter(t=>[t.note,t.tag,t.cat,acc(t.acc).name,t.to?acc(t.to).name:''].join(' ').toLowerCase().includes(q));
if(!ts.length)return`<p class="empty">${q?'没有匹配的记录。':'这个月还没有记录。点右上角“记一笔”开始。'}</p>`;
ts.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
let h='',last='';
ts.forEach(t=>{if(t.date!==last){last=t.date;const d=new Date(t.date+'T00:00');h+=`<div class="dh">${t.date.slice(5).replace('-','月')}日 周${'日一二三四五六'[d.getDay()]}</div>`}
const a=acc(t.acc),c=a.cur;let amt,cls='',sub;
if(t.type==='tr'){const b=acc(t.to);amt=fmt(t.amt,c)+(b.cur!==c?' → '+fmt(t.toAmt,b.cur):'');sub=a.name+' → '+b.name}
else{amt=(t.type==='in'?'+':'-')+fmt(t.amt,c);cls=t.type;sub=a.name}
h+=`<div class="row" onclick="openTx('${t.id}')"><span class="ic">${IC[t.cat]||'🧾'}</span><div class="mid"><div>${esc(t.cat)}${(t.note?' <span class="mu">'+esc(t.note)+'</span>':'')+(t.tag?' <span class="mu">#'+esc(t.tag)+'</span>':'')+(t.reim==1?' <span class="out">待报销</span>':t.reim==2?' <span class="in">已报销</span>':'')}</div><small>${esc(sub)}</small></div><div class="amt ${cls}">${amt}</div></div>`});
return h}

const PAL=['#007aff','#34c759','#ff9500','#af52de','#ff2d55','#5ac8fa','#ffcc00','#8e8e93'];let DN;
function donut(s,B){let cs=Object.entries(s.c).sort((a,b)=>b[1]-a[1]);if(!cs.length)return'<p class="empty">本月暂无支出。</p>';
if(cs.length>7){const r=cs.slice(7).reduce((n,x)=>n+x[1],0);cs=cs.slice(0,7);cs.push(['其他合计',r])}
DN={cs,B,o:s.o,sel:-1};const R=70,C=2*Math.PI*R,gap=cs.length>1?2.5:0;let off=0;
const arcs=cs.map(([k,v],i)=>{const L=v/s.o*C,d=Math.max(L-gap,.5);const x=`<circle class="seg" cx="90" cy="90" r="${R}" fill="none" stroke="${PAL[i]}" stroke-width="22" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" onclick="dsel(${i})"/>`;off+=L;return x}).join('');
return`<div class="card dn"><svg viewBox="0 0 180 180" class="dsv" role="img" aria-label="支出分类占比">${arcs}<text x="90" y="85" text-anchor="middle" class="dl" id="dl1">总支出</text><text x="90" y="107" text-anchor="middle" class="dv" id="dv1">${fmt(s.o,B)}</text></svg>
<div class="lg">${cs.map(([k,v],i)=>`<div class="li" onclick="dsel(${i})"><i style="background:${PAL[i]}"></i><span>${esc(k)}</span><span class="mu">${(v/s.o*100).toFixed(0)}%</span><b>${fmt(v,B)}</b></div>`).join('')}</div></div>`}
function dsel(i){const r=DN.sel===i;DN.sel=r?-1:i;document.querySelectorAll('.seg').forEach((e,j)=>e.style.opacity=r||j===i?1:.28);
$('#dl1').textContent=r?'总支出':DN.cs[i][0];$('#dv1').textContent=fmt(r?DN.o:DN.cs[i][1],DN.B)}
function statsView(){const s=monthSum(V.m),B=S.base,bud=conv(S.budget,'JPY',B);
let h=`<div class="sum"><div class="in">${fmt(s.i,B)}<small>收入</small></div><div class="out">${fmt(s.o,B)}<small>支出</small></div><div>${fmt(s.i-s.o,B)}<small>结余</small></div></div>`;
if(S.budget>0){const p=Math.min(100,s.o/bud*100);h+=`<div class="card"><div class="line" style="margin:0"><span>本月预算</span><span>${fmt(s.o,B)} / ${fmt(bud,B)}</span></div><div class="bar ${s.o>bud?'over':''}"><i style="width:${p}%"></i></div><small>${s.o>bud?'已超出 '+fmt(s.o-bud,B):'还剩 '+fmt(bud-s.o,B)}</small></div>`}
const pend=S.tx.filter(t=>t.reim==1).reduce((n,t)=>n+conv(t.amt,acc(t.acc).cur,B),0);
if(pend)h+=`<div class="card line" style="margin-top:0"><span>待报销合计</span><span class="out">${fmt(pend,B)}</span></div>`;
const bl=Object.keys(S.cb).filter(k=>S.cb[k]>0);

function cn2n(t){let n=0,s=0,c=0;for(const h of t){if(h in CNN)c=CNN[h];else if(h==='十'){s+=(c||1)*10;c=0}else if(h==='百'){s+=c*100;c=0}else if(h==='千'){s+=c*1000;c=0}else if(h==='万'){n+=(s+c||1)*1e4;s=0;c=0}}return n+s+c}
const KW={餐饮:'吃|饭|餐|咖啡|奶茶|外卖|零食|饮料|买菜|拉面|寿司|居酒屋|烧肉',日用品:'日用|纸巾|洗衣|洗发|牙膏|药妆|洗漱',交通:'地铁|电车|公交|打车|出租|新干线|机票|车票|交通|Suica',房租水电:'房租|水电|电费|水费|燃气|煤气|物业|网费',通讯:'话费|流量|通讯|手机费|宽带',购物:'购物|衣服|鞋|网购|亚马逊|乐天',医疗:'医院|药|看病|牙医|体检',娱乐:'电影|游戏|演出|演唱会|会员|订阅',旅行:'旅行|酒店|民宿|住宿|门票|旅游',人情:'礼物|请客|红包|份子|礼金',教育:'学费|课|书|培训|考试',汽车:'加油|停车|高速|保养|车险|洗车|车检',工资:'工资|薪水|薪资',副业收入:'稿费|副业|兼职|接单|广告|佣金',退款:'退款',投资收益:'分红|利息|股息|收益'};
function vParse(t){let d=new Date(),m;
if(m=t.match(/(\d{1,2})月(\d{1,2})[日号]/)){d=new Date(d.getFullYear(),m[1]-1,m[2]);t=t.replace(m[0],' ')}
else{const k=[['大前天',3],['前天',2],['昨天',1]].find(([w])=>t.includes(w));if(k){d.setDate(d.getDate()-k[1]);t=t.replace(k[0],' ')}else t=t.replace('今天',' ')}
const o={date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),amt:0};
if(m=t.match(/(\d+(?:\.\d+)?)\s*万/))o.amt=m[1]*1e4;
else if(m=t.match(/(\d[\d,]*(?:\.\d+)?)/))o.amt=parseFloat(m[1].replace(/,/g,''));
else if(m=t.match(/([零一二两三四五六七八九十百千万]+)\s*(?:元|块|日元|円|日币|人民币)/))o.amt=cn2n(m[1]);
const cur=/日元|円|日币|JPY/i.test(t)?'JPY':/人民币|块|元|CNY|RMB/i.test(t)?'CNY':null;
const na=S.accounts.find(a=>t.includes(a.name));
o.acc=(na||(cur&&S.accounts.find(a=>a.cur===cur))||S.accounts[0]).id;
const inW=/工资|薪水|收入|收到|入账|退款|分红|利息|卖了/.test(t)||(/红包/.test(t)&&!/发|送|给/.test(t));
o.type=inW?'in':'out';const L=S.cats[o.type];
o.cat=L.find(c=>t.includes(c))||L.find(c=>KW[c]&&new RegExp(KW[c],'i').test(t))||(L.includes('其他')?'其他':L[0]);
o.note=t.replace(/\d[\d,.]*\s*万?|[零一二两三四五六七八九十百千万]+(?=\s*(?:元|块|日元|円))|日元|円|日币|人民币|元|块|JPY|CNY/gi,' ').replace(na?na.name:'§',' ').replace(/用了?|花了?|买了?|支付|付了?/g,' ').replace(/\s+/g,' ').trim();
return o}

const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){let c=~0;for(const x of b)c=CT[(c^x)&255]^(c>>>8);return(~c)>>>0}
function zip(fs){const E=new TextEncoder(),parts=[],cd=[];let off=0,cs=0;
for(const[n,t]of fs){const nb=E.encode(n),d=E.encode(t),c=crc(d),h=new DataView(new ArrayBuffer(30));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(12,33,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);parts.push(h,nb,d);

function xl(sheets){const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',N='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
